<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <style>
    .box{stroke:#555;stroke-width:2;rx:14;ry:14}
    .txt{font-family:Arial,sans-serif;fill:#111}
    .title{font-size:22px;font-weight:bold}
    .small{font-size:16px}
    .arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .dash{stroke-dasharray:8 6}
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker>
  </defs>
  <rect class="box" x="470" y="25" width="160" height="55" fill="#dbeafe"/>
  <text class="txt title" x="550" y="60" text-anchor="middle">Internet</text>

  <rect class="box" x="330" y="115" width="440" height="55" fill="#fff2cc"/>
  <text class="txt small" x="550" y="138" text-anchor="middle">ALB Security Group</text>
  <text class="txt small" x="550" y="158" text-anchor="middle">HTTP :80 from Internet</text>

  <rect class="box" x="340" y="205" width="420" height="95" fill="#d5e8d4"/>
  <text class="txt title" x="550" y="235" text-anchor="middle">Application Load Balancer</text>
  <text class="txt small" x="550" y="260" text-anchor="middle">phase3-alb • Internet-facing • IPv4</text>
  <text class="txt small" x="550" y="282" text-anchor="middle">Listener HTTP :80</text>

  <rect class="box" x="365" y="335" width="370" height="95" fill="#e1d5e7"/>
  <text class="txt title" x="550" y="365" text-anchor="middle">Target Group</text>
  <text class="txt small" x="550" y="390" text-anchor="middle">phase3-web-tg • HTTP :80</text>
  <text class="txt small" x="550" y="412" text-anchor="middle">Health check: / → 200</text>

  <rect class="box" x="140" y="500" width="280" height="110" fill="#f8cecc"/>
  <text class="txt title" x="280" y="540" text-anchor="middle">EC2 Web Node</text>
  <text class="txt small" x="280" y="567" text-anchor="middle">AZ-a • Nginx • HTTP :80</text>
  <text class="txt small" x="280" y="590" text-anchor="middle">Managed by ASG</text>

  <rect class="box" x="680" y="500" width="280" height="110" fill="#f8cecc"/>
  <text class="txt title" x="820" y="540" text-anchor="middle">EC2 Web Node</text>
  <text class="txt small" x="820" y="567" text-anchor="middle">AZ-b • Nginx • HTTP :80</text>
  <text class="txt small" x="820" y="590" text-anchor="middle">Managed by ASG</text>

  <rect class="box" x="330" y="655" width="440" height="85" fill="#cce5ff"/>
  <text class="txt title" x="550" y="688" text-anchor="middle">Auto Scaling Group</text>
  <text class="txt small" x="550" y="715" text-anchor="middle">phase3-web-asg • desired 2 • min 1 • max 2</text>

  <line class="arrow" x1="550" y1="80" x2="550" y2="115"/>
  <line class="arrow" x1="550" y1="170" x2="550" y2="205"/>
  <line class="arrow" x1="550" y1="300" x2="550" y2="335"/>
  <line class="arrow" x1="480" y1="430" x2="300" y2="500"/>
  <line class="arrow" x1="620" y1="430" x2="800" y2="500"/>
  <line class="arrow dash" x1="420" y1="655" x2="280" y2="610"/>
  <line class="arrow dash" x1="680" y1="655" x2="820" y2="610"/>

  <rect class="box" x="365" y="755" width="370" height="40" fill="#eaf4ea"/>
  <text class="txt small" x="550" y="781" text-anchor="middle">Launch Template + User Data define new instances</text>
</svg>
